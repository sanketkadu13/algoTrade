server {
    listen 80 default_server;
    server_name _;

    auth_basic           "Kite Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd-kite;

    # Public: invite-token-gated onboarding. Must skip basic-auth so invitees
    # (who have no admin password) can reach the form. Server-side token check
    # is the actual security here — no token ≡ no provisioning.
    location ^~ /onboard {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
    }

    # /logout — must bypass basic-auth so the Flask handler can return its
    # own 401 with a rotated realm string, which invalidates the browser's
    # cached creds for the original realm.
    location = /logout {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
    }

    # Static assets (favicon, future css/images) — public by nature; needed
    # by the no-auth /onboard page and by browsers' default /favicon.ico hit.
    location /static/ {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }
    location = /favicon.ico {
        auth_basic off;
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Everything else (dashboard, API routes) stays behind basic-auth.
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Server-Sent Events: no buffering, long timeouts, no caching
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
        gzip                off;
    }
}
